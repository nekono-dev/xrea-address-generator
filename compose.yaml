services:
  app:
    build: .
    image: xrea-address-generator:local
    # 環境変数ファイルは ENV_FILE で差し替えられる（既定は .env）
    env_file: ${ENV_FILE:-.env}
    environment:
      BIND_ADDRESS: "0.0.0.0"
      PORT: "3000"
      SESSION_DIR: /var/lib/xrea-address-generator/session
    volumes:
      - proton-session:/var/lib/xrea-address-generator/session
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
      start_interval: 1s
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    # TUNNEL_TOKEN が空なら起動しない（0 のあとに、トークンがあるときだけ 1 が付く）
    deploy:
      replicas: 0${TUNNEL_TOKEN:+1}
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  proton-session:
